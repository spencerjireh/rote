[package]
name = "rote"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
directories = "6.0.0"
globset = "0.4.20"
libc = "0.2.189"
owo-colors = "4.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing"] }
toml = "1.1.4"

[dev-dependencies]
tempfile = "3.27.0"
