# rote's own configuration — the intended first dogfooding target.
#
# Generated by `rote init`, then edited. The [checks] commands below were
# detected rather than guessed: this machine's Homebrew Rust has no rustup
# shim, so `cargo clippy` does not resolve and the hyphenated binaries are
# what actually run.
#
# Values here override the global ~/.config/rote/config.toml.

# Maximum lines per transcription hunk. Larger raw diffs are split.
max_hunk_lines = 20

# true = trailing whitespace differences count as divergence when classifying.
strict_whitespace = false

[shadow]
# Gitignored files the agent needs; copied real -> shadow on every sync.
copy = []           # rote has no .env; nothing to carry across

# Paths that survive the shadow's clean, so the agent's builds stay warm.
# Build output ONLY -- never source, never anything the diff reads.
preserve = [
    "target/",
    "node_modules/",
    ".venv/",
    "dist/",
    "build/",
]

[transcribe]
# Generated files. Presented whole and gated on a byte comparison rather than
# typed line by line -- run the generating command instead.
verbatim = [
    "Cargo.lock",
]

[checks]
# Run in the REAL tree at `rote done`, in order, stopping on the first failure.
#
# `just gate` rather than the three cargo commands `rote init` detected here.
# Detection is per-machine and this file is committed: it had the hyphenated
# `cargo-clippy` / `cargo-fmt` spelling, which a Homebrew Rust needs and a
# rustup one does not have, so `rote done` failed both checks for anyone who
# cloned rote. The justfile is the one place that knows which spelling works;
# routing through it is what makes this line true on both.
#
# Costs a `just` on PATH. That is a fair ask of someone hacking on rote, and
# it is only this repository's own config — `rote init` still writes plain
# cargo commands for a project that has no justfile.
commands = ["just gate"]

[review]
# Headless reviewer pass over the session diff at `rote done`.
enabled = true
# Extra args appended to `claude -p`, e.g. ["--model", "claude-haiku-4-5"]
model_args = []
